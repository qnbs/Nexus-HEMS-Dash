name: Deploy

on:
  # Auto-deploy the live demo on every push to main. main only accepts
  # green-CI PRs (branch ruleset), so a push here is already post-CI. The
  # deploy job still needs a successful build (needs: build), so a broken
  # build never publishes.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      approveDeploy:
        description: 'Type DEPLOY to confirm production pages deployment'
        required: true
        default: 'NO'

# Read-only default; build/deploy jobs declare required scopes.
permissions: read-all

concurrency:
  group: 'pages'
  # Do not cancel an in-flight Pages publish — rapid main pushes otherwise leave
  # github-pages in a bad state and the next deploy fails with "try again later".
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GITHUB_PAGES_DEPLOYMENTS_KEEP: '10'
  # Cooldown between Pages publishes — rapid main pushes trigger "try again later".
  GITHUB_PAGES_COOLDOWN_SEC: '180'
  # upload-pages-artifact reserves an in_progress deployment for the current SHA;
  # treat foreign stuck deploys as stale after 3 min (was 10 min — caused 15 min deadlocks).
  GITHUB_PAGES_STALE_IN_PROGRESS_SEC: '180'

jobs:
  wait-for-ci:
    name: Wait for CI Passed (exact SHA)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      checks: read
    steps:
      - name: Poll required check rollup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="${GITHUB_SHA}"
          for _ in $(seq 1 90); do
            conclusion=$(gh api "/repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs" \
              --jq '.check_runs[] | select(.name=="✅ CI Passed") | .conclusion' | head -1 || true)
            if [ "${conclusion}" = "success" ]; then
              echo "✅ CI Passed on ${sha}"
              exit 0
            fi
            if [ "${conclusion}" = "failure" ] || [ "${conclusion}" = "cancelled" ]; then
              echo "CI rollup concluded: ${conclusion}"
              exit 1
            fi
            sleep 30
          done
          echo "Timed out waiting for ✅ CI Passed on ${sha}"
          exit 1

  build:
    needs: [wait-for-ci]
    if: always() && (needs.wait-for-ci.result == 'success' || needs.wait-for-ci.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # download CI artifact + upload-pages-artifact

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve successful CI workflow run
        id: ci_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow=ci.yml \
            --commit "${GITHUB_SHA}" --status=success \
            --json databaseId --jq '.[0].databaseId // empty')"
          if [ -z "${run_id}" ]; then
            echo "::error::No successful ci.yml run for ${GITHUB_SHA}; cannot promote Pages without CI build artifact"
            exit 1
          fi
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
          echo "Promoting CI artifact from run ${run_id} (commit ${GITHUB_SHA})" >> "$GITHUB_STEP_SUMMARY"

      - name: Download CI build artifact (no rebuild)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build
          path: apps/web/dist
          github-token: ${{ github.token }}
          run-id: ${{ steps.ci_run.outputs.run_id }}

      - name: Record promoted dist fingerprint
        run: bash .github/scripts/verify-promoted-pages-artifact.sh apps/web/dist "${{ github.sha }}"

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: './apps/web/dist'

  prune-before-deploy:
    # Prune *before* publish so GitHub Pages API is not wedged by 100+ stale deployments.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.approveDeploy == 'DEPLOY')
    runs-on: ubuntu-latest
    permissions:
      deployments: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prune stale github-pages deployments (keep newest 10)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bash .github/scripts/prune-github-pages-deployments.sh "${GITHUB_PAGES_DEPLOYMENTS_KEEP}" github-pages

  wait-for-pages-idle:
    # Must NOT use environment: github-pages — that job-level binding creates an
    # in_progress deployment before steps run, deadlocking the idle-wait script.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.approveDeploy == 'DEPLOY')
    runs-on: ubuntu-latest
    needs: [build, prune-before-deploy]
    timeout-minutes: 20
    permissions:
      deployments: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Wait for github-pages environment idle (pre-deploy)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: >-
          bash .github/scripts/wait-for-github-pages-idle.sh
          github-pages "${GITHUB_PAGES_COOLDOWN_SEC}" 900 20 "${GITHUB_PAGES_STALE_IN_PROGRESS_SEC}"

  deploy:
    # Auto-deploy on push to main; manual dispatch keeps the explicit DEPLOY gate.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.approveDeploy == 'DEPLOY')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, prune-before-deploy, wait-for-pages-idle]
    timeout-minutes: 45
    permissions:
      pages: write
      id-token: write
      deployments: read

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          timeout: 600000
          reporting_interval: 15000

      - name: Wait before Pages retry (1/3)
        if: steps.deployment.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: >-
          bash .github/scripts/wait-for-github-pages-idle.sh
          github-pages 60 600 20 "${GITHUB_PAGES_STALE_IN_PROGRESS_SEC}"

      - name: Retry Pages deploy (1/3)
        if: steps.deployment.outcome == 'failure'
        id: deployment_retry
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          timeout: 600000
          reporting_interval: 15000

      - name: Wait before Pages retry (2/3)
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: >-
          bash .github/scripts/wait-for-github-pages-idle.sh
          github-pages 120 600 20 "${GITHUB_PAGES_STALE_IN_PROGRESS_SEC}"

      - name: Retry Pages deploy (2/3)
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome != 'success'
        id: deployment_retry2
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          timeout: 600000
          reporting_interval: 15000

      - name: Wait before Pages retry (3/3)
        if: >-
          steps.deployment.outcome == 'failure' &&
          steps.deployment_retry.outcome != 'success' &&
          steps.deployment_retry2.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: >-
          bash .github/scripts/wait-for-github-pages-idle.sh
          github-pages 180 600 20 "${GITHUB_PAGES_STALE_IN_PROGRESS_SEC}"

      - name: Retry Pages deploy (3/3)
        if: >-
          steps.deployment.outcome == 'failure' &&
          steps.deployment_retry.outcome != 'success' &&
          steps.deployment_retry2.outcome != 'success'
        id: deployment_retry3
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          timeout: 600000
          reporting_interval: 15000

      - name: Fail if Pages deploy did not succeed
        if: >-
          always() &&
          !(steps.deployment.outcome == 'success' ||
            steps.deployment_retry.outcome == 'success' ||
            steps.deployment_retry2.outcome == 'success' ||
            steps.deployment_retry3.outcome == 'success')
        run: |
          echo "::error::GitHub Pages deployment failed (initial + 3 retries). Deploy Recovery will rerun failed jobs after cooldown, or dispatch deploy.yml manually."
          exit 1

  verify-pages:
    # Catch “green workflow, public 403” regressions early.
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify Pages root is publicly reachable
        env:
          PAGE_URL: https://qnbs.github.io/Nexus-HEMS-Dash/
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "${PAGE_URL}")
            echo "Attempt ${attempt}: ${PAGE_URL} → HTTP ${code}"
            if [ "${code}" = "200" ]; then
              exit 0
            fi
            sleep 30
          done
          echo "::error::Pages root returned HTTP ${code} (expected 200). See docs/runbooks/Pages-403-Remediation.md"
          exit 1

      - name: Verify deployed bundle embeds expected build SHA
        env:
          PAGE_URL: https://qnbs.github.io/Nexus-HEMS-Dash/
          EXPECTED_SHA: ${{ github.sha }}
        run: bash .github/scripts/verify-pages-build-sha.sh "${PAGE_URL}" "${EXPECTED_SHA}"

  prune-deployments:
    # Auto-deploy creates one github-pages deployment per push, which pile up
    # (150+). After a successful deploy, keep only the newest few and delete the
    # rest so the environment's deployment list stays small.
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      deployments: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prune old github-pages deployments (keep newest 10)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bash .github/scripts/prune-github-pages-deployments.sh "${GITHUB_PAGES_DEPLOYMENTS_KEEP}" github-pages
