name: Security Freshness Heartbeat

# Detects missing scheduled security scans (#387). Runs daily and on manual dispatch.
on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: security-freshness-heartbeat
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Fail if no successful scheduled run within this many days.
  MAX_STALE_DAYS: '8'

jobs:
  heartbeat:
    name: Scheduled security scan freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check SBOM workflow freshness
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_STALE_DAYS: ${{ env.MAX_STALE_DAYS }}
        run: bash .github/scripts/security-scan-freshness.sh sbom-scan.yml "${MAX_STALE_DAYS}"

      - name: Check Scorecard workflow freshness
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_STALE_DAYS: ${{ env.MAX_STALE_DAYS }}
        run: bash .github/scripts/security-scan-freshness.sh scorecard.yml "${MAX_STALE_DAYS}"
