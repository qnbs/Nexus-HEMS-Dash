name: OpenSSF Scorecard

on:
  # Weekly scan every Monday at 03:00 UTC
  schedule:
    - cron: '0 3 * * 1'
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Declare default permissions as read only
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    # No job-level or workflow-level `env` — ossf/scorecard-action rejects
    # publish_results when the scorecard job defines env vars (OpenSSF API 400).
    permissions:
      # Needed to publish results and get a badge (see publish_results below)
      id-token: write
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish results to OpenSSF REST API for badge
          publish_results: ${{ github.event_name != 'pull_request' }}

      # Explicit SARIF upload for GitHub Code scanning tool status (ossf action alone
      # can leave Tool status in error while the Actions job is green).
      - name: Upload Scorecard SARIF to code scanning
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: results.sarif
          category: OpenSSF Scorecard
