name: PR Feedback Summary

# Posts one bot-owned summary comment per PR, updated in place as CI,
# security, Lighthouse, and perf workflows complete (sections keyed by
# workflow display name). Reduces delete/recreate churn vs a fresh comment
# per upstream completion (#443).
#
# Runs on workflow_run so it has write access to PR comments without
# granting broad write permissions to the heavy workflows themselves.

on:
  workflow_run:
    workflows:
      - CI
      - Security Full
      - Lighthouse CI
      - Performance Benchmark
    types:
      - completed

permissions:
  contents: read

concurrency:
  # Key on the head branch (repeats across the 4 upstream workflow_run completions
  # for the same PR) so overlapping summary-postings dedupe. workflow_run.id would be
  # unique per run, making the group a no-op.
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  summarize:
    name: Post PR Feedback Summary
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Post summary comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        with:
          script: |
            const { upsertPrFeedbackSummary } = await import(
              `${process.cwd()}/scripts/pr-feedback-summary.mjs`
            );
            const run = context.payload.workflow_run;
            const prs = run.pull_requests;
            if (!prs || prs.length === 0) {
              core.info('No associated PRs; skipping summary comment.');
              return;
            }
            const pr = prs[0];
            const repo = context.repo;
            await upsertPrFeedbackSummary(github, {
              owner: repo.owner,
              repo: repo.repo,
              prNumber: pr.number,
            }, {
              html_url: run.html_url,
              name: run.name,
              conclusion: run.conclusion,
              head_sha: run.head_sha,
            });
