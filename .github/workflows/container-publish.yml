name: Container Publish

# Build, Grype-scan, push, and cosign-sign production images to GHCR.
# Images match Helm values: ghcr.io/qnbs/nexus-hems-dash (frontend) and
# ghcr.io/qnbs/nexus-hems-server (backend).

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: container-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    name: Publish ${{ matrix.component }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: frontend
            dockerfile: Dockerfile
            image: ghcr.io/qnbs/nexus-hems-dash
          - component: server
            dockerfile: Dockerfile.server
            image: ghcr.io/qnbs/nexus-hems-server

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set build metadata
        id: date
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ matrix.image }}
          tags: |
            type=sha,prefix=
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image (load for Grype)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ${{ matrix.image }}:${{ github.sha }}
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.date.outputs.date }}
            VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Validate Grype policy
        run: bash scripts/verify-grype-policy.sh

      - name: Scan image (Grype)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ matrix.image }}:${{ github.sha }}
          config: .grype.yaml
          fail-build: true
          severity-cutoff: critical
          output-format: sarif

      - name: Record scanned image identity
        id: scanned
        run: |
          set -euo pipefail
          ref="${{ matrix.image }}:${{ github.sha }}"
          image_id="$(docker inspect --format='{{.Id}}' "$ref")"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "image_id=${image_id}" >> "$GITHUB_OUTPUT"
          {
            echo "### Scanned artifact (${{ matrix.component }})"
            echo "- ref: \`${ref}\`"
            echo "- image ID: \`${image_id}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push scanned image to GHCR (promote, no rebuild)
        id: push
        run: |
          set -euo pipefail
          source_ref="${{ steps.scanned.outputs.ref }}"
          mapfile -t tags <<< "${{ steps.meta.outputs.tags }}"
          if [ "${#tags[@]}" -eq 0 ] || [ -z "${tags[0]}" ]; then
            echo "::error::metadata-action produced no push tags"
            exit 1
          fi
          digest=""
          for tag in "${tags[@]}"; do
            [ -z "$tag" ] && continue
            docker tag "$source_ref" "$tag"
            push_out="$(docker push "$tag" 2>&1)"
            echo "$push_out"
            if [ -z "$digest" ]; then
              digest="$(printf '%s\n' "$push_out" | rg -o 'sha256:[a-f0-9]{64}' | tail -1 || true)"
            fi
          done
          if [ -z "$digest" ]; then
            digest="$(docker inspect --format='{{index .RepoDigests 0}}' "${tags[0]}" | cut -d@ -f2)"
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Promoted ${source_ref} (ID ${{ steps.scanned.outputs.image_id }}) → ${digest}" >> "$GITHUB_STEP_SUMMARY"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (cosign keyless)
        run: |
          cosign sign --yes "${{ matrix.image }}@${{ steps.push.outputs.digest }}"

      - name: Generate SLSA provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
