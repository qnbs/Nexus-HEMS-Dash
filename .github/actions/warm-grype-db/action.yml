name: Warm Grype vulnerability DB
description: >-
  Install Grype and retry `grype db update` before anchore/scan-action (#411).
  Pairs with scan-action `cache-db: true` to avoid "database does not exist" flakes.

inputs:
  grype-version:
    description: Grype release tag (without v prefix)
    required: false
    default: '0.84.0'
  max-attempts:
    description: Retry count for grype db update
    required: false
    default: '5'

runs:
  using: composite
  steps:
    - name: Install Grype CLI
      shell: bash
      run: |
        set -euo pipefail
        curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | \
          sh -s -- -b /usr/local/bin "v${{ inputs.grype-version }}"
        grype version

    - name: Update Grype vulnerability database
      shell: bash
      run: |
        set -euo pipefail
        max="${{ inputs.max-attempts }}"
        attempt=1
        while [ "${attempt}" -le "${max}" ]; do
          if grype db update; then
            echo "Grype DB update succeeded on attempt ${attempt}"
            exit 0
          fi
          echo "::warning::grype db update failed (attempt ${attempt}/${max})"
          sleep $((attempt * 5))
          attempt=$((attempt + 1))
        done
        echo "::error::grype db update failed after ${max} attempts"
        exit 1
