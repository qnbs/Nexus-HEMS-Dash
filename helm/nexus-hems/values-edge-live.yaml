# Example overlay: single writer with durable WAL on Kubernetes (#452).
# Use: helm upgrade --install nexus-hems ./helm/nexus-hems -f helm/nexus-hems/values-edge-live.yaml
#
# Profile intent (enforced by chart guards — Refs #452):
# - One API server pod + RWO WAL PVC (no server HPA while PVC enabled).
# - Recreate rollout (no surge overlap on shared WAL).
# - Not certified for production live hardware until maintainer acceptance on #452.

replicaCount:
  server: 1

autoscaling:
  enabled: false

deployment:
  strategy:
    type: Recreate

server:
  redisUrl: 'redis://nexus-hems-redis:6379'
  walPersistence:
    enabled: true
    create: true
    size: 2Gi
    accessModes:
      - ReadWriteOnce

env:
  ADAPTER_MODE: mock
